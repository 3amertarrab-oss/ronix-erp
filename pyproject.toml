[project]
name = "ronix_erp"
authors = [
  { name = "Eng. Amer Tarrab", email = "3amertarrab@gmail.com" }
]
description = "RONIX STEEL ERP extensions for contracts, claims, projects, and controlled commercial workflows"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

