  #ronix-1004{--rx-bg:light-dark(#f4f4f0,#161819);--rx-panel:light-dark(#fff,#222526);--rx-paper:light-dark(#fff,#252829);--rx-ink:light-dark(#222b2b,#edf0ed);--rx-muted:light-dark(#64716d,#b0bbb5);--rx-line:light-dark(#dde2dd,#414846);--rx-gold:light-dark(#785518,#efcd86);--rx-soft:light-dark(#f4ecdc,#3c3424);--rx-active:light-dark(#203a31,#bdd8c9);--rx-active-ink:light-dark(#fff,#172d23);--rx-danger:light-dark(#a33e31,#ffad9d);--rx-subtle:light-dark(#f7f9f7,#2b302d);color:var(--rx-ink);background:var(--rx-bg);font-family:Arial,Tahoma,sans-serif;font-size:14px;line-height:1.65;border:1px solid var(--rx-line);border-radius:16px;overflow-wrap:anywhere}
  #ronix-1004 *{box-sizing:border-box}#ronix-1004 [hidden]{display:none!important}
  #ronix-1004 h2,#ronix-1004 h3,#ronix-1004 p{margin:0}#ronix-1004 h2{font-size:20px;font-weight:500}#ronix-1004 h3{font-size:17px;font-weight:500}#ronix-1004 strong{font-weight:500}
  #ronix-1004 button,#ronix-1004 input,#ronix-1004 select,#ronix-1004 textarea{font:inherit;color:var(--rx-ink)}
  #ronix-1004 button{border:1px solid var(--rx-line);background:var(--rx-panel);border-radius:9px;padding:7px 13px;min-height:38px}
  #ronix-1004 button:hover{background:var(--rx-soft)}#ronix-1004 button:disabled{opacity:.45}
  #ronix-1004 .rx-primary{background:var(--rx-active);color:var(--rx-active-ink);border-color:var(--rx-active)}
  #ronix-1004 input:not([type=checkbox]),#ronix-1004 select,#ronix-1004 textarea{width:100%;min-width:0;background:var(--rx-panel);border:1px solid var(--rx-line);border-radius:8px;padding:8px 10px;min-height:40px}
  #ronix-1004 input[type=checkbox]{accent-color:var(--rx-active);width:17px;height:17px;margin:0;flex-shrink:0}
  #ronix-1004 input[type=number]{font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
  #ronix-1004 label{min-width:0}#ronix-1004 label>span{display:block;margin-bottom:4px}
  #ronix-1004 .rx-muted{color:var(--rx-muted);font-size:12px}
  #ronix-1004 .rx-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 20px 18px;background:var(--rx-panel);border-radius:16px 16px 0 0;border-bottom:1px solid var(--rx-line)}
  #ronix-1004 .rx-heading{display:flex;flex-wrap:wrap;align-items:center;gap:7px 17px}#ronix-1004 .rx-heading>.rx-muted{flex-basis:100%}
  #ronix-1004 .rx-wordmark{font-size:18px;letter-spacing:1px;font-weight:500}#ronix-1004 .rx-wordmark span{color:var(--rx-gold);letter-spacing:0;margin-left:4px}
  #ronix-1004 .rx-doc-tabs{display:flex;gap:4px;flex-shrink:0}#ronix-1004 .rx-doc-tabs [aria-pressed=true]{background:var(--rx-active);color:var(--rx-active-ink);border-color:var(--rx-active)}
  #ronix-1004 .rx-workspace{display:grid;grid-template-columns:145px minmax(0,1.3fr) minmax(0,1fr);gap:14px;padding:16px}
  #ronix-1004 .rx-nav{display:flex;flex-direction:column;gap:5px;align-self:start}
  #ronix-1004 .rx-nav button{display:flex;gap:8px;text-align:right;align-items:center;border-color:transparent;background:transparent;padding:8px;font-size:13px}
  #ronix-1004 .rx-nav button[aria-current=step]{background:var(--rx-panel);border-color:var(--rx-line);color:var(--rx-gold)}
  #ronix-1004 .rx-step-number{display:inline-flex;justify-content:center;align-items:center;flex-shrink:0;width:23px;height:23px;background:var(--rx-panel);border:1px solid var(--rx-line);border-radius:50%;font-size:12px;font-variant-numeric:tabular-nums}
  #ronix-1004 [aria-current=step] .rx-step-number{background:var(--rx-active);color:var(--rx-active-ink);border-color:var(--rx-active)}
  #ronix-1004 .rx-editor{background:var(--rx-panel);border:1px solid var(--rx-line);border-radius:12px;min-width:0;padding:17px;align-self:start}
  #ronix-1004 .rx-section-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
  #ronix-1004 .rx-section-top .rx-muted{color:var(--rx-gold)}
  #ronix-1004 .rx-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#ronix-1004 .rx-full{grid-column:1/-1}
  #ronix-1004 .rx-fields label{font-size:13px}
  #ronix-1004 .rx-paths{display:grid;gap:10px;margin-bottom:14px}
  #ronix-1004 .rx-paths button{text-align:right;padding:13px;font-size:15px}
  #ronix-1004 .rx-paths button small{display:block;color:var(--rx-muted);font-size:12px;margin-top:4px}
  #ronix-1004 .rx-paths button[aria-pressed=true]{background:var(--rx-soft);border-color:var(--rx-gold)}
  #ronix-1004 .rx-item{border-top:1px solid var(--rx-line);padding:13px 0}#ronix-1004 .rx-item:first-of-type{border-top:0;padding-top:0}
  #ronix-1004 .rx-item-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #ronix-1004 .rx-check{display:flex;align-items:center;gap:9px;min-height:36px}

<script>
/* Physical A4 pagination, shared by the scaled preview and print output. */
window.RonixPaper=(()=>{
  const accents=`<svg class="rnx-paper-accents" viewBox="0 0 210 297" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path fill="#193853" d="M0 0H210V2.5C146 0 119 12 61 7C32 4 16 5 0 16Z"/><path fill="none" stroke="#b38a46" stroke-width=".65" d="M0 20C25 1 48 11 76 10S149 0 210 5"/><path fill="none" stroke="#becbd5" stroke-width=".3" d="M0 24C5 43 10 54 8 83S3 126 5 159"/><path fill="none" stroke="#b38a46" stroke-width=".35" d="M210 166C206 197 209 236 201 268C197 284 174 289 137 291"/><path fill="#eef3f6" d="M0 285C43 302 81 285 129 293C164 299 185 292 210 281V297H0Z"/><path fill="none" stroke="#b38a46" stroke-width=".5" d="M0 290C42 303 79 288 127 295C162 300 185 294 210 285"/></svg>`;
  const make=(html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;};
  function paginate(groups,header,footer,lang){
    const stage=document.getElementById('pagination-stage');stage.innerHTML='';
    const pages=[],problems=[];let sheet,body;
    const newPage=()=>{sheet=make(`<article class="rnx-sheet" lang="${lang==='en'?'en':'ar'}" dir="${lang==='en'?'ltr':'rtl'}">${accents}<header class="rnx-paper-header">${header(pages.length)}</header><div class="rnx-paper-body"></div><footer class="rnx-paper-footer">${footer}</footer></article>`);stage.append(sheet);body=sheet.querySelector('.rnx-paper-body');pages.push(sheet);};
    const overflows=()=>body.scrollHeight>body.clientHeight+1;
    const section=(g)=>{const node=make(g.shell||'<div class="rnx-block"></div>');body.append(node);return node;};
    for(const g of groups){
      if(!g.units.length)continue;
      if(!sheet||g.pageBreak&&body.childElementCount)newPage();
      let wrapper=section(g),target=g.target?wrapper.querySelector(g.target):wrapper;
      for(const html of g.units){
        const unit=make(html);target.append(unit);
        if(overflows()){
          unit.remove();if(!target.children.length&&g.target)wrapper.remove();else if(!wrapper.children.length)wrapper.remove();
          if(body.childElementCount){newPage();wrapper=section(g);target=g.target?wrapper.querySelector(g.target):wrapper;}
          else if(!wrapper.isConnected){wrapper=section(g);target=g.target?wrapper.querySelector(g.target):wrapper;}
          target.append(unit);
          if(overflows())problems.push('يوجد بند طويل يتجاوز مساحة صفحة كاملة. اختصره أو قسّمه إلى بنود.');
        }
      }
    }
    if(!pages.length)newPage();
    pages.forEach((p,i)=>{p.querySelector('[data-page-number]').textContent=`${i+1} / ${pages.length}`;});
    return {html:pages.map(p=>p.outerHTML).join(''),pages:pages.map(p=>p.outerHTML),problems:[...new Set(problems)]};
  }
  function fit(){
    const holder=document.getElementById('rx-paper');if(!holder||!holder.clientWidth)return;
    holder.querySelectorAll('.paper-shell').forEach(shell=>{const paper=shell.firstElementChild;const scale=Math.min(1,shell.clientWidth/paper.offsetWidth);paper.style.transform=`scale(${scale})`;shell.style.height=`${paper.offsetHeight*scale}px`;});
  }
  return {paginate,fit};
})();
