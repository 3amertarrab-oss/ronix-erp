name: Validate RONIX ERP app

on:
  push:
    branches: [main, frappe-app]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python, TOML, and DocType JSON
        run: python scripts/validate_app.py

      - name: Run migration safety unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate JavaScript syntax
        run: |
          find ronix_erp -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
